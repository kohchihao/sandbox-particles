name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Scenario tests
        run: npm run test:scenario

      - name: Invariant tests
        run: npm run test:invariants

      - name: Golden replays
        run: npm run test:golden

      - name: Production build strips debug hooks
        run: |
          npm run build
          if grep -R -q -E "out-of-grid|__sand" dist; then
            echo "production bundle contains debug-only code"
            grep -R -n -E "out-of-grid|__sand" dist || true
            exit 1
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright
        run: npm run test:e2e

      - name: Benchmark
        run: npm run bench

      - name: Upload Playwright report and test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
